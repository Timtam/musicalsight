name: CI/CD

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
permissions:
    pages: write # to deploy to Pages
    id-token: write # to verify the deployment originates from an appropriate source
jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  lfs: "true"

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}

            # Needed by scripts/build-track-profiles.ts, which decodes every
            # training track to measure which frequencies it actually
            # contains. Without ffmpeg the profiles come out empty and the
            # games fall back to asking about bands that may not be there.
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg

            - name: Install dependencies
              run: npm install

            - name: Build
              run: npm run build
            - name: Upload static files as artifact
              id: deployment
              uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
              with:
                  path: dist/
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
